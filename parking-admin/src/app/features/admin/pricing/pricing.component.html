<div class="max-w-3xl mx-auto">

  <!-- CARD -->
  <div
    class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-8">

    <!-- HEADER -->
    <div class="mb-6">
      <h2 class="text-xl font-semibold text-slate-800">
        💰 Configuração de preços
      </h2>
      <p class="text-sm text-slate-500 mt-1">
        Defina o valor da hora por tipo de veículo
      </p>
    </div>

    <!-- LOADING -->
    <div *ngIf="loading" class="flex justify-center py-10">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- FORM -->
    <form
      *ngIf="!loading"
      [formGroup]="form"
      (ngSubmit)="save()"
      class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- MOTO -->
      <mat-form-field appearance="outline">
        <mat-label>🏍️ Moto (R$/hora)</mat-label>
        <input
          matInput
          type="number"
          formControlName="motorcycle"
          placeholder="Ex: 8.00" />
        <mat-error *ngIf="form.controls.motorcycle.invalid">
          Valor inválido
        </mat-error>
      </mat-form-field>

      <!-- CARRO -->
      <mat-form-field appearance="outline">
        <mat-label>🚗 Carro (R$/hora)</mat-label>
        <input
          matInput
          type="number"
          formControlName="car"
          placeholder="Ex: 12.00" />
        <mat-error *ngIf="form.controls.car.invalid">
          Valor inválido
        </mat-error>
      </mat-form-field>

      <!-- CAMINHÃO -->
      <mat-form-field appearance="outline">
        <mat-label>🚚 Caminhão (R$/hora)</mat-label>
        <input
          matInput
          type="number"
          formControlName="truck"
          placeholder="Ex: 20.00" />
        <mat-error *ngIf="form.controls.truck.invalid">
          Valor inválido
        </mat-error>
      </mat-form-field>

      <!-- ACTIONS -->
      <div class="md:col-span-3 flex justify-end gap-4 mt-4">

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loading || form.invalid"
          class="px-8 py-2 rounded-xl font-semibold shadow-sm">
          <mat-icon class="mr-2">save</mat-icon>
          Salvar preços
        </button>

      </div>
    </form>

    <!-- SUCCESS -->
    <div
      *ngIf="success"
      class="mt-6 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-700">
      ✅ Preços atualizados com sucesso
    </div>

    <!-- ERROR -->
    <div
      *ngIf="error"
      class="mt-6 rounded-xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">
      ❌ {{ error }}
    </div>

  </div>
</div>
