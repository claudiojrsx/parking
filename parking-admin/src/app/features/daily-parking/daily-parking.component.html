<div class="max-w-4xl mx-auto mt-12 space-y-10">

  <!-- CHECK-IN CARD -->
  <div class="p-6 md:p-8 card card-hover">

    <div class="text-center mb-8">
      <div class="text-4xl mb-2">🚗</div>
      <h2 class="text-2xl font-semibold text-slate-800 dark:text-slate-100">
        Check-in de Veículo
      </h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        Registre a entrada de um veículo no estacionamento
      </p>
    </div>

    <form class="space-y-6">

      <!-- PLACA -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
          Placa do veículo
        </label>

        <input
          (input)="plate = plate.toUpperCase()"
          [(ngModel)]="plate"
          name="plate"
          type="text"
          placeholder="ABC-1234"
          class="w-full rounded-xl border px-4 py-3 text-sm transition
                 bg-white dark:bg-slate-800
                 text-slate-700 dark:text-slate-200
                 border-slate-200 dark:border-slate-600
                 focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500" />
      </div>

      <!-- TIPO -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
          Tipo de veículo
        </label>

        <div class="grid grid-cols-3 gap-2">

          <button type="button"
                  (click)="vehicleType = VehicleType.Car"
                  class="filter-btn"
                  [ngClass]="{ 'filter-btn-active': vehicleType === VehicleType.Car }">
            🚗 Carro
          </button>

          <button type="button"
                  (click)="vehicleType = VehicleType.Motorcycle"
                  class="filter-btn"
                  [ngClass]="{ 'filter-btn-active': vehicleType === VehicleType.Motorcycle }">
            🏍 Moto
          </button>

          <button type="button"
                  (click)="vehicleType = VehicleType.Truck"
                  class="filter-btn"
                  [ngClass]="{ 'filter-btn-active': vehicleType === VehicleType.Truck }">
            🚚 Caminhão
          </button>

        </div>
      </div>

      <!-- BOTÃO -->
      <button type="button"
              (click)="registerEntry()"
              [disabled]="loading || !plate || !vehicleType"
              class="w-full bg-blue-600 hover:bg-blue-700
                     text-white py-3 rounded-xl font-semibold shadow-md
                     transition disabled:opacity-50">

        {{ loading ? 'Registrando...' : 'Registrar Entrada' }}

      </button>

    </form>

    <!-- FEEDBACK -->
    <div class="mt-6 space-y-3">

      <div *ngIf="successMessage"
           class="px-4 py-3 rounded-xl text-sm font-medium
                  bg-emerald-50 dark:bg-emerald-900/30
                  border border-emerald-200 dark:border-emerald-800
                  text-emerald-700 dark:text-emerald-300">
        ✅ {{ successMessage }}
      </div>

      <div *ngIf="errorMessage"
           class="px-4 py-3 rounded-xl text-sm font-medium
                  bg-rose-50 dark:bg-rose-900/30
                  border border-rose-200 dark:border-rose-800
                  text-rose-700 dark:text-rose-300">
        ❌ {{ errorMessage }}
      </div>

    </div>

  </div>


  <!-- VEÍCULOS ATIVOS -->
  <div class="p-6 md:p-8 card">

    <h3 class="text-xl font-semibold mb-6 text-slate-800 dark:text-slate-100">
      Veículos Estacionados
    </h3>

    <div *ngIf="activeParkings.length === 0"
         class="text-sm text-slate-500 dark:text-slate-400">
      Nenhum veículo estacionado no momento.
    </div>

    <div *ngFor="let parking of activeParkings"
         class="flex items-center justify-between p-4 mb-3 rounded-xl
                bg-slate-50 dark:bg-slate-800/50">

      <div>
        <div class="font-semibold text-slate-800 dark:text-slate-100">
          {{ parking.vehiclePlate }}
        </div>
        <div class="text-xs text-slate-500">
          Entrada: {{ parking.entryTime | date:'short' }}
        </div>
      </div>

      <button
        (click)="registerExit(parking.id)"
        class="bg-rose-500 hover:bg-rose-600
               text-white px-4 py-2 rounded-xl text-sm transition">
        Registrar Saída
      </button>

    </div>

  </div>

</div>
