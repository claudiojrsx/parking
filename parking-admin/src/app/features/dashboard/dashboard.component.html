<!-- HEADER -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-8">
  <h1 class="text-3xl font-bold tracking-tight text-slate-800 dark:text-slate-100">
    Dashboard de Vagas
  </h1>

  <div class="grid grid-cols-3 gap-2">
    <button type="button" (click)="changeType(ParkingSpotType.Car)" class="filter-btn"
      [ngClass]="{ 'filter-btn-active': selectedType === ParkingSpotType.Car }">
      🚗 Carro
    </button>

    <button type="button" (click)="changeType(ParkingSpotType.Motorcycle)" class="filter-btn"
      [ngClass]="{ 'filter-btn-active': selectedType === ParkingSpotType.Motorcycle }">
      🏍 Moto
    </button>

    <button type="button" (click)="changeType(ParkingSpotType.Truck)" class="filter-btn"
      [ngClass]="{ 'filter-btn-active': selectedType === ParkingSpotType.Truck }">
      🚚 Caminhão
    </button>
  </div>
</div>

<!-- CARDS -->
<div class="grid gap-6 md:grid-cols-3" *ngIf="summary">

  <!-- TOTAL -->
  <div class="p-6 rounded-2xl shadow-sm border transition hover:shadow-md
              bg-white dark:bg-slate-900
              border-slate-200 dark:border-slate-700">
    <p class="text-sm font-bold mb-2 text-slate-500 dark:text-slate-400">
      Total de Vagas
    </p>
    <div class="flex items-end justify-between">
      <span class="text-4xl font-bold text-slate-800 dark:text-slate-100">
        {{ summary.total }}
      </span>
      <span class="text-slate-400 dark:text-slate-500 text-xl">🅿️</span>
    </div>
  </div>

  <!-- LIVRES -->
  <div class="p-6 rounded-2xl shadow-sm border transition hover:shadow-md
              bg-emerald-50 dark:bg-emerald-900/30
              border-emerald-200 dark:border-emerald-800">
    <p class="text-sm font-bold mb-2 text-emerald-700 dark:text-emerald-300">
      Vagas Livres
    </p>
    <div class="flex items-end justify-between">
      <span class="text-4xl font-bold text-emerald-700 dark:text-emerald-300">
        {{ summary.free }}
      </span>
      <span class="text-emerald-500 dark:text-emerald-400 text-xl">✅</span>
    </div>
  </div>

  <!-- OCUPADAS -->
  <div class="p-6 rounded-2xl shadow-sm border transition hover:shadow-md
              bg-rose-50 dark:bg-rose-900/30
              border-rose-200 dark:border-rose-800">
    <p class="text-sm font-bold mb-2 text-rose-700 dark:text-rose-300">
      Ocupadas
    </p>
    <div class="flex items-end justify-between">
      <span class="text-4xl font-bold text-rose-700 dark:text-rose-300">
        {{ summary.occupied }}
      </span>
      <span class="text-rose-500 dark:text-rose-400 text-xl">🚫</span>
    </div>
  </div>

</div>
