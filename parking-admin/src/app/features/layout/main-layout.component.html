<mat-toolbar color="primary" class="topbar">
  <!-- Logo -->
  <div class="logo">
    🚗 <strong>Parking</strong>
  </div>

  <nav class="menu">
    <button mat-button routerLink="/dashboard" routerLinkActive="active">
      Dashboard
    </button>

    <button mat-button routerLink="/parking-spots" routerLinkActive="active">
      Vagas
    </button>

    <button mat-button [matMenuTriggerFor]="parkingMenu">
      Parking
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #parkingMenu="matMenu">
      <button mat-menu-item routerLink="/parking/check-in">
        <mat-icon>login</mat-icon>
        Check-in
      </button>

      <button mat-menu-item routerLink="/parking/check-out">
        <mat-icon>logout</mat-icon>
        Check-out
      </button>
    </mat-menu>

    <button mat-button routerLink="/admin" routerLinkActive="active">
      Admin
    </button>
  </nav>

  <span class="spacer"></span>

  <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
    <mat-icon>account_circle</mat-icon>
    Minha conta
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      Perfil
    </button>

    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      Sair
    </button>
  </mat-menu>
</mat-toolbar>

<!-- CONTAINER GLOBAL -->
<div class="max-w-[1440px] mx-auto px-6">

  <!-- Breadcrumb -->
  <div class="pt-4">
    <app-breadcrumb />
  </div>

  <!-- Conteúdo -->
  <main class="py-6">
    <router-outlet />
  </main>

</div>
