<div class="max-w-4xl mx-auto float-start">
  <div class="card card-hover mb-6 p-8">

    <!-- HEADER -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold text-slate-800 dark:text-slate-100">
        Configuração de preços
      </h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        Defina o valor por hora para cada tipo de veículo
      </p>
    </div>

    <!-- FORM -->
    <form [formGroup]="form" (ngSubmit)="save()" class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- CARD BASE -->
      <ng-container *ngFor="let item of [
        { key: 'motorcycle', label: 'Moto', icon: '🏍️' },
        { key: 'car', label: 'Carro', icon: '🚗' },
        { key: 'truck', label: 'Caminhão', icon: '🚚' }
      ]">

        <div class="rounded-xl border border-slate-200 bg-slate-50 p-5 transition
                 hover:shadow-md
                 dark:border-slate-700 dark:bg-slate-800">

          <div class="flex items-center gap-3 mb-4">
            <span class="text-2xl">{{ item.icon }}</span>
            <div>
              <p class="font-semibold text-slate-800 dark:text-slate-100">
                {{ item.label }}
              </p>
              <p class="text-xs text-slate-500 dark:text-slate-400">
                Valor por hora
              </p>
            </div>
          </div>

          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 dark:text-slate-400">
              R$
            </span>

            <input type="number" [formControlName]="item.key" placeholder="0,00" class="w-full pl-10 pr-16 py-3 rounded-lg border border-slate-300
                     bg-white text-slate-800
                     focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                     outline-none text-lg font-medium
                     dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" />

            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs
                     text-slate-500 dark:text-slate-400">
              /hora
            </span>
          </div>

          <p *ngIf="form.controls[item.key].invalid && form.controls[item.key].touched"
            class="mt-2 text-xs text-rose-600 dark:text-rose-400">
            Valor inválido
          </p>
        </div>

      </ng-container>

      <!-- ACTIONS -->
      <div class="md:col-span-3 flex justify-end mt-6">
        <button type="submit" [disabled]="form.invalid || loading"
        class="w-fit inline-flex items-center justify-center gap-1
         rounded-xl
         bg-blue-600 hover:bg-blue-700
         text-white
         py-3 px-3
         pr-4 pb-4 pl-5
         font-semibold
         leading-none
         shadow-lg transition">
          Salvar preços
        </button>
      </div>
    </form>

    <!-- SUCCESS -->
    <div *ngIf="success" class="mt-6 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-700
             dark:border-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300">
      ✅ Preços atualizados com sucesso
    </div>

    <!-- ERROR -->
    <div *ngIf="error" class="mt-6 rounded-xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700
             dark:border-rose-800 dark:bg-rose-900/30 dark:text-rose-300">
      ❌ {{ error }}
    </div>

  </div>
</div>
