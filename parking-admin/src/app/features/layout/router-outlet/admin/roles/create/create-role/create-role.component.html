<div class="max-w-4xl mx-auto card card-hover mb-6 p-8">
  <div class="mb-8">
    <h2 class="text-xl font-semibold text-slate-800 dark:text-slate-100">
      Criar Novo Role
    </h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
      Defina o nome do novo role que será criado
    </p>
  </div>

  <form (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
        Nome
      </label>
      <input type="text" name="name" [(ngModel)]="roleName" required class="w-full rounded-xl border px-4 py-3 text-sm transition
                   bg-white dark:bg-slate-800
                   text-slate-700 dark:text-slate-200
                   border-slate-200 dark:border-slate-600
                   focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500" />
    </div>

    <div class="flex justify-end gap-2 pt-4">
      <button type="submit" [disabled]="loading" class="flex items-center gap-2 px-8 py-3 rounded-xl
                 bg-blue-600 text-white font-semibold shadow-md
                 hover:bg-blue-700 disabled:opacity-50 transition">
        {{ loading ? 'Salvando...' : 'Criar Role' }}
      </button>
    </div>
  </form>
</div>
