<div class="mx-auto">
  <div class="card card-hover space-y-6 mb-6 p-8">

    <div class="space-y-1">
      <h2 class="text-xl font-semibold text-slate-800 dark:text-slate-100">
        Lista de Usuários
      </h2>
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Listagem de usuários e seus status no sistema
      </p>
    </div>

    <table mat-table [dataSource]="dataSource" matSort class="w-full">

      <!-- Nome -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-xs font-semibold uppercase tracking-wide
           bg-slate-50 dark:bg-slate-800
           text-slate-600 dark:text-slate-400">
          Status
        </th>

        <td mat-cell *matCellDef="let user" class="px-6 py-4">
          <span class="inline-flex items-center px-3 py-1 rounded-full
             text-xs font-medium" [ngClass]="user.isActive
        ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-400'
        : 'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-400'">
            {{ user.isActive ? 'Ativo' : 'Inativo' }}
          </span>
        </td>
      </ng-container>

      <!-- Ações -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button color="primary">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons class="mt-4"></mat-paginator>
  </div>
</div>
