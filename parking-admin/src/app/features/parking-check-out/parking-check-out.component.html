<div class="overflow-hidden rounded-2xl
            border border-slate-200 dark:border-slate-700
            shadow-sm
            bg-white dark:bg-slate-900">

  <table mat-table [dataSource]="dataSource" class="w-full">

    <!-- Placa -->
    <ng-container matColumnDef="plate">
      <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-xs font-semibold uppercase tracking-wide
                 bg-slate-50 dark:bg-slate-800
                 text-slate-600 dark:text-slate-400">
        Placa
      </th>

      <td mat-cell *matCellDef="let row" class="px-6 py-4">
        <span class="inline-flex items-center rounded-full px-3 py-1
                 text-xs font-medium
                 bg-slate-100 text-slate-700
                 dark:bg-slate-700 dark:text-slate-200">
          {{ row.plate }}
        </span>
      </td>
    </ng-container>

    <!-- Tipo -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-xs font-semibold uppercase tracking-wide
                 bg-slate-50 dark:bg-slate-800
                 text-slate-600 dark:text-slate-400">
        Tipo
      </th>

      <td mat-cell *matCellDef="let row" class="px-6 py-4">
        <span class="inline-flex items-center rounded-full px-3 py-1 text-xs font-medium" [ngClass]="{
                    'bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-400': row.vehicleType === 'Car',
                    'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-400': row.vehicleType === 'Motorcycle',
                    'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-400': row.vehicleType === 'Truck'
                  }">
          {{ row.vehicleType }}
        </span>
      </td>
    </ng-container>

    <!-- Entrada -->
    <ng-container matColumnDef="checkIn">
      <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-xs font-semibold uppercase tracking-wide
                 bg-slate-50 dark:bg-slate-800
                 text-slate-600 dark:text-slate-400">
        Entrada
      </th>

      <td mat-cell *matCellDef="let row" class="px-6 py-4 text-sm text-slate-600 dark:text-slate-300">
        {{ row.checkInAt | date:'short' }}
      </td>
    </ng-container>

    <!-- Ação -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-xs font-semibold uppercase tracking-wide text-right
                 bg-slate-50 dark:bg-slate-800
                 text-slate-600 dark:text-slate-400">
        Ação
      </th>

      <td mat-cell *matCellDef="let row" class="px-6 py-4 text-right">
        <button (click)="checkOut(row.vehicleId)" [disabled]="loading" class="inline-flex items-center gap-2
                 rounded-xl px-6 py-2.5
                 bg-rose-600 text-white text-sm font-medium
                 shadow-lg
                 hover:bg-rose-700
                 disabled:opacity-50 disabled:cursor-not-allowed
                 transition">
          <mat-icon class="text-white text-base">exit_to_app</mat-icon>
          Check-out
        </button>
      </td>
    </ng-container>

    <!-- Header -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Rows -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
      class="transition hover:bg-slate-50 dark:hover:bg-slate-800">
    </tr>

  </table>

  <!-- Resultado do Check-out -->
  <div *ngIf="result" class="m-6 rounded-2xl border
            border-emerald-200 dark:border-emerald-500/30
            bg-emerald-50 dark:bg-emerald-500/10
            p-5 transition">

    <h3 class="mb-4 flex items-center gap-2 text-sm font-semibold
             text-emerald-700 dark:text-emerald-400">
      <span class="text-lg">✅</span>
      Check-out realizado com sucesso
    </h3>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 text-sm">

      <!-- Duração -->
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl
               bg-emerald-100 text-emerald-700
               dark:bg-emerald-500/20 dark:text-emerald-400">
          ⏱️
        </div>

        <div>
          <div class="text-xs font-semibold uppercase
                    text-emerald-600 dark:text-emerald-400">
            Duração
          </div>
          <strong class="text-emerald-800 dark:text-emerald-200">
            {{ result.duration }}
          </strong>
        </div>
      </div>

      <!-- Valor -->
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl
               bg-emerald-100 text-emerald-700
               dark:bg-emerald-500/20 dark:text-emerald-400">
          💰
        </div>

        <div>
          <div class="text-xs font-semibold uppercase
                    text-emerald-600 dark:text-emerald-400">
            Valor
          </div>
          <strong class="text-emerald-800 dark:text-emerald-200">
            R$ {{ result.amount | number:'1.2-2' }}
          </strong>
        </div>
      </div>

    </div>

    <!-- Ações -->
    <div class="mt-5 flex justify-end">
      <button (click)="generateReceipt()" class="flex items-center gap-2 rounded-xl
           bg-emerald-600 hover:bg-emerald-700
           text-white px-5 py-3
           text-sm font-semibold
           shadow-sm transition">

        <mat-icon class="text-white text-base">receipt_long</mat-icon>
        Gerar recibo
      </button>
    </div>
  </div>

</div>

<mat-paginator class="mt-4 rounded-2xl border border-slate-200 bg-white px-2 shadow-sm" [pageSize]="5"
  [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
</mat-paginator>
