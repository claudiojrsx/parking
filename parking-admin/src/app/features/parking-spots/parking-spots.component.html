<div class="mb-6 grid grid-cols-1 md:grid-cols-4 gap-4 items-end
         bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">

  <!-- Tipo -->
  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-2">
      Tipo de vaga
    </label>

    <select [(ngModel)]="selectedType" (change)="loadSpots()" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm text-slate-700
                 focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500
                 transition">
      <option [ngValue]="ParkingSpotType.Car">🚗 Carro</option>
      <option [ngValue]="ParkingSpotType.Motorcycle">🏍️ Moto</option>
      <option [ngValue]="ParkingSpotType.Truck">🚚 Caminhão</option>
    </select>
  </div>

  <!-- Código -->
  <div class="md:col-span-2">
    <label class="block text-sm font-semibold text-slate-700 mb-2">
      Código da vaga
    </label>

    <input type="text" placeholder="Ex: A-01" [(ngModel)]="newSpot.code" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm text-slate-700
                 focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500
                 transition" />
  </div>

  <!-- Botão -->
  <div class="flex items-end h-full pb-1">
    <button (click)="createSpot()" class="w-full rounded-xl bg-blue-600 text-white py-3
             font-semibold text-sm shadow-sm btn-primary
             hover:bg-blue-700 transition">
      Criar vaga
    </button>
  </div>
</div>

<div class="overflow-hidden rounded-2xl border border-slate-200
         shadow-sm bg-white">

  <table mat-table [dataSource]="dataSource" matSort class="w-full">

    <!-- Código -->
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-xs font-semibold text-slate-600 uppercase">
        Código
      </th>

      <td mat-cell *matCellDef="let spot" class="text-sm text-slate-700">
        {{ spot.code }}
      </td>

      <td mat-footer-cell *matFooterCellDef colspan="1" class="text-sm text-slate-600 bg-slate-50 font-medium">
        Total: <strong>{{ summary?.total }}</strong>
        &nbsp;•&nbsp;
        Livres: <strong class="text-emerald-600">{{ summary?.free }}</strong>
        &nbsp;•&nbsp;
        Ocupadas: <strong class="text-rose-600">{{ summary?.occupied }}</strong>
      </td>
    </ng-container>

    <!-- Tipo -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef class="text-xs font-semibold text-slate-600 uppercase">
        Tipo
      </th>

      <td mat-cell *matCellDef="let spot">
        <mat-chip color="primary">
          {{ spot.type }}
        </mat-chip>
      </td>

      <td mat-footer-cell *matFooterCellDef></td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef class="text-xs font-semibold text-slate-600 uppercase">
        Status
      </th>

      <td mat-cell *matCellDef="let spot">
        <mat-chip [color]="spot.isOccupied ? 'warn' : 'accent'">
          {{ spot.isOccupied ? 'Ocupada' : 'Livre' }}
        </mat-chip>
      </td>

      <td mat-footer-cell *matFooterCellDef></td>
    </ng-container>

    <!-- HEADER -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- ROWS -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-slate-50 transition">
    </tr>

    <!-- FOOTER -->
    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>

  </table>
</div>

<mat-paginator class="mt-4 rounded-xl border border-slate-200 bg-white shadow-sm" [pageSize]="5"
  [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
</mat-paginator>
