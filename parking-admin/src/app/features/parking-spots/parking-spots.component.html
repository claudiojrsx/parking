<div class="mb-6 p-5 space-y-6 card card-hover">

  <div class="flex justify-end">
    <div class="grid grid-cols-3 gap-2 w-full sm:w-auto">
      <button type="button" (click)="selectedType = ParkingSpotType.Car; loadSpots()" class="filter-btn"
        [ngClass]="{ 'filter-btn-active': selectedType === ParkingSpotType.Car }">
        🚗 Carro
      </button>

      <button type="button" (click)="selectedType = ParkingSpotType.Motorcycle; loadSpots()" class="filter-btn"
        [ngClass]="{ 'filter-btn-active': selectedType === ParkingSpotType.Motorcycle }">
        🏍️ Moto
      </button>

      <button type="button" (click)="selectedType = ParkingSpotType.Truck; loadSpots()" class="filter-btn"
        [ngClass]="{ 'filter-btn-active': selectedType === ParkingSpotType.Truck }">
        🚚 Caminhão
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">

    <div class="md:col-span-2">
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
        Código da vaga
      </label>

      <input type="text" placeholder="Ex: A-01" [(ngModel)]="newSpot.code" class="w-full rounded-xl border px-4 py-3 text-sm transition
               bg-white dark:bg-slate-800
               text-slate-700 dark:text-slate-200
               border-slate-200 dark:border-slate-600
               placeholder-slate-400 dark:placeholder-slate-500
               focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500" />
    </div>

    <div>
      <button (click)="createSpot()" class="w-full rounded-xl bg-blue-600 hover:bg-blue-700
               text-white py-3 mb-0.5 font-semibold text-sm shadow-sm transition">
        Criar vaga
      </button>
    </div>

  </div>
</div>

<div class="overflow-hidden rounded-2xl
            border border-slate-200 dark:border-slate-700
            shadow-sm
            bg-white dark:bg-slate-900">

  <table mat-table [dataSource]="dataSource" matSort class="w-full">

    <!-- Código -->
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-6 py-4 text-xs font-semibold uppercase tracking-wide
                 bg-slate-50 dark:bg-slate-800
                 text-slate-600 dark:text-slate-400">
        Código
      </th>

      <td mat-cell *matCellDef="let spot" class="px-6 py-4 text-sm font-medium text-slate-700 dark:text-slate-200">
        {{ spot.code }}
      </td>

      <td mat-footer-cell *matFooterCellDef class="px-6 py-4 text-sm font-medium
                 bg-slate-50 dark:bg-slate-800
                 text-slate-600 dark:text-slate-400">
        Total: <strong>{{ summary?.total }}</strong>
        &nbsp;•&nbsp;
        Livres:
        <strong class="text-emerald-600 dark:text-emerald-400">
          {{ summary?.free }}
        </strong>
        &nbsp;•&nbsp;
        Ocupadas:
        <strong class="text-rose-600 dark:text-rose-400">
          {{ summary?.occupied }}
        </strong>
      </td>
    </ng-container>

    <!-- Tipo -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-xs font-semibold uppercase tracking-wide
                 bg-slate-50 dark:bg-slate-800
                 text-slate-600 dark:text-slate-400">
        Tipo
      </th>

      <td mat-cell *matCellDef="let spot" class="px-6 py-4">
        <mat-chip class="text-xs font-medium" color="primary" selected>
          {{ spot.type }}
        </mat-chip>
      </td>

      <td mat-footer-cell *matFooterCellDef class="bg-slate-50 dark:bg-slate-800"></td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-xs font-semibold uppercase tracking-wide
                 bg-slate-50 dark:bg-slate-800
                 text-slate-600 dark:text-slate-400">
        Status
      </th>

      <td mat-cell *matCellDef="let spot" class="px-6 py-4">
        <span class="px-3 py-1 rounded-full text-xs font-semibold" [ngClass]="spot.isOccupied
            ? 'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-400'
            : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-400'">
          {{ spot.isOccupied ? 'Ocupada' : 'Livre' }}
        </span>
      </td>

      <td mat-footer-cell *matFooterCellDef class="bg-slate-50 dark:bg-slate-800"></td>
    </ng-container>

    <!-- Header -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Rows -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
      class="transition hover:bg-slate-50 dark:hover:bg-slate-800">
    </tr>

    <!-- Footer -->
    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>

  </table>
</div>

<mat-paginator class="mt-4 rounded-xl
         border border-slate-200 dark:border-slate-700
         bg-white dark:bg-slate-900
         shadow-sm" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
</mat-paginator>
