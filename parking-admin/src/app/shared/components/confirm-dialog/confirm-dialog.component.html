<div
  *ngIf="open"
  class="fixed inset-0 z-50 flex items-center justify-center"
>
  <!-- BACKDROP -->
  <div
    class="absolute inset-0 bg-black/40 backdrop-blur-sm"
    (click)="onCancel()"
  ></div>

  <!-- MODAL -->
  <div
    class="relative bg-white w-full max-w-md mx-4 rounded-2xl p-6 shadow-xl animate-in fade-in zoom-in-95"
  >
    <h3 class="text-lg font-semibold text-slate-800 mb-2">
      {{ title }}
    </h3>

    <p class="text-sm text-slate-500 mb-6">
      {{ description }}
    </p>

    <div class="flex justify-end gap-3">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 rounded-lg border text-slate-600 hover:bg-slate-100 transition"
      >
        {{ cancelText }}
      </button>

      <button
        type="button"
        (click)="onConfirm()"
        class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition btn-primary"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
