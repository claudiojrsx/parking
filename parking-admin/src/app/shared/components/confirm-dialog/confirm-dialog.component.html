<!-- Backdrop -->
<div *ngIf="open" class="fixed inset-0 z-40 flex items-center justify-center
         bg-black/30 backdrop-blur-sm
         transition-opacity duration-300">

  <!-- Modal -->
  <div class="z-50 w-full max-w-md rounded-2xl bg-white p-6
           shadow-xl
           transform transition-all duration-300
           scale-95 opacity-0
           animate-modal-in">

    <!-- Título -->
    <h2 class="text-lg font-semibold text-slate-800 mb-2">
      {{ title }}
    </h2>

    <!-- Descrição -->
    <p class="text-sm text-slate-600 mb-6">
      {{ description }}
    </p>

    <!-- Ações -->
    <div class="flex justify-end gap-3">
      <button (click)="onCancel()" class="rounded-xl border border-slate-200 px-4 py-2
               text-sm font-medium text-slate-600
               hover:bg-slate-50 transition">
        {{ cancelText }}
      </button>

      <button (click)="onConfirm()"
        class="px-4 py-2 rounded-lg bg-green-600 !important text-white hover:bg-green-700 transition btn-primary">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
